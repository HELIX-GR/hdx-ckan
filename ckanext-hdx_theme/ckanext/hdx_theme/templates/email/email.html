<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600&display=swap" rel="stylesheet" type="text/css">
    <style>
      .hdx-email {
        background-color: #1EBFB3;
        margin: 0;
        padding: 40px 0;
        font-family: 'Source Sans Pro', sans-serif;
      }

      .hdx-email .hdx-container {
        max-width: 658px;
        margin: 0 auto;
        padding: 0;
        background-color: #ffffff;
      }

      .hdx-email .hdx-space {
        padding: 48px;
      }

      .hdx-email .hdx-content p {
        font-size: 16px;
        line-height: 140%;
        margin-top: 0;
        margin-bottom: 15px;
      }

      .hdx-email .hdx-content ol, .hdx-content ul {
        padding-left: 24px;
      }

      .hdx-email .hdx-content li {
        font-size: 16px;
        line-height: 130%;
      }

      .hdx-email .hdx-content a {
        text-decoration: none;
        color: #007CE1;
      }

      .hdx-email .hdx-content .button {
        display: inline-block;
        color: #fff;
        background-color: #007CE1;
        padding: 19px 32px;
        font-weight: 600;
        margin: 16px 0;
        font-size: 14px;
        line-height: 130%;
        text-decoration: none;
      }

      .hdx-email .hdx-content .quote {
        margin-bottom: 15px;
        margin-left: 15px;
        padding-left: 10px;
        border-left: 2px solid #F2F2F2;
      }
      .hdx-email .hdx-content .quote p {
        margin-bottom: 0;
        line-height: 130%;
      }

      .hdx-email .hdx-logo {
        padding: 25px;
        background-color: #F2F2F2;
      }

      .hdx-email .hdx-logo a {
        display: block;
      }

      .hdx-email .hdx-logo img {
        width: 220px;
        height: auto;
        display: block;
      }

      .hdx-email .hdx-footer {
        background-color: #f5f8ff;
        padding: 32px;
        margin-top: 32px;
        color: #494747;
      }

      .hdx-email .hdx-footer a {
        color: #494747;
      }

      .hdx-email .hdx-footer .social-icon {
        text-decoration: none;
      }

      .hdx-email .hdx-footer img {
        max-width: 18px;
        height: auto;
        margin-right: 5px;
        margin-top: 32px;
        display: inline-block;
        vertical-align: middle;
      }

      .hdx-email .hdx-footer p {
        font-size: 14px;
        line-height: 130%;
        margin-top: 0;
        margin-bottom: 0;
      }

      @media (max-width: 678px) {
        .hdx-email {
          background-color: #fff !important;
          padding: 0 !important;
        }

        .hdx-email .hdx-container {
          max-width: 100% !important;
        }

        .hdx-email .hdx-space {
          padding: 35px !important;
        }

        .hdx-email .hdx-logo {
          background-color: #fff !important;
        }

        .hdx-email .hdx-logo a {
          width: 90px !important;
          overflow: hidden !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="hdx-email">
      <div class="hdx-container">
        <div class="hdx-logo">
          <a href="{{ config.get('ckan.site_url') }}" target="_blank">
            <img src="{{ data.logo_hdx_email }}" alt="HEAL-Link">
          </a>
        </div>
        <div class="hdx-space">
          <div class="hdx-content">
            {% snippet data._snippet, data=data.data %}
          </div>
          <div class="hdx-footer">
            <p>{% if data.footer %}You are receiving this email because you are a registered HEAL-Link user. {% endif %}<a href="{{ config.get('ckan.site_url') }}" title="HEAL-Link" target="_blank">HEAL-Link</a> - HARDMIN, the Hellenic Academic Research Data Management Initiative.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
